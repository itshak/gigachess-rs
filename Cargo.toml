[package]
name = "gigachess"
version = "0.1.0"
edition = "2021"
authors = ["GigaChess Contributors"]
license = "MIT"
description = "Ultra-high-performance, 100% MIT-licensed chess move generator, 16-bit moves2 replay engine, and Shakmaty compat layer in Rust"
repository = "https://github.com/itshak/gigachess-rs"
homepage = "https://github.com/itshak/gigachess-rs"
keywords = ["chess", "movegen", "bitboard", "pext", "zobrist"]
categories = ["games", "algorithms", "data-structures"]
readme = "README.md"

[features]
default = ["std"]
std = []
pext = [] # Enables hardware PEXT (BMI2) 1-cycle bitboards
simd = [] # Enables AVX2/NEON vectorization where supported

[dependencies]
arrayvec = { version = "0.7", default-features = false }
bitflags = { version = "2.4", optional = true }
rayon = "1.10" # Batch-replay work-stealing thread pool (ADR-002)

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false

[profile.bench]
lto = "fat"
codegen-units = 1
incremental = false
debug = false

[dev-dependencies]
criterion = "0.5"
rayon = "1.10"
cozy-chess = "0.3" # Head-to-head benchmark reference (dev-dependency)
shakmaty = "0.30" # Baseline verification + SAN parity oracle (dev-dependency only)

[[bench]]
name = "perft_bench"
harness = false

[[bench]]
name = "replay_bench"
harness = false

[[bench]]
name = "vs_libraries"
harness = false
path = "benches/vs_libraries/main.rs"

[[bench]]
name = "codec_bench"
harness = false

[[bench]]
name = "micro"
harness = false
