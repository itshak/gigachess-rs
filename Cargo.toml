[package]
name = "gigachess"
version = "0.1.11"
edition = "2021"
authors = ["GigaChess Contributors"]
license = "MIT"
description = "High-performance MIT Rust chess move generator: Chess960, PEXT/magic bitboards, Polyglot hashes, and 16-bit packed game replay."
repository = "https://github.com/itshak/gigachess-rs"
homepage = "https://github.com/itshak/gigachess-rs"
keywords = ["chess", "movegen", "bitboard", "pext", "zobrist"]
categories = ["games", "algorithms", "data-structures"]
readme = "README.md"

[features]
exp-no-rights-kernel = []
exp-promotion-direct = []
exp-layout-hot = []
exp-layout-roles = []
exp-hash-role-order = []
exp-ray-combined = []
exp-unalign = []
exp-kingless-ray = ["exp-kingless-board"]
exp-checker-sentinel = []
exp-refresh-inline = []
exp-attack-mask = []
exp-castle-pair = []
exp-hash-turn-fold = []
exp-quiet-ep-gate = []
exp-promo-checkers = []
exp-pawnless4 = ["exp-sparse-role3"]
exp-zone-sliders = []
exp-ep-mask = []
exp-special-cold = []
exp-role-tree = []
exp-role-simd = []
exp-capture-direct = []
exp-checked-cached = []
exp-quiet-common = []
exp-sparse-role3 = ["exp-slider-planes"]
exp-sparse-role3-branchless = ["exp-sparse-role3"]
exp-direct-role-xor = []
exp-castle-compact = []
exp-checker-pair = []
exp-compact-attack-desc = []
exp-blocked-sliders = []
exp-no-danger-needed = []
exp-undo-outside = []
exp-hash-pointer = []
exp-hash-pair = ["exp-hash-pointer"]
exp-fen-code-lut = []
exp-color-gen = []
exp-bulk-write = []
exp-pawn-kernel = []
exp-child-copy = []
exp-checker-first = []
exp-align16 = []
exp-align32 = []
exp-ordinary-kernel = []
exp-hash-pawn-bytes = []
exp-hash-delta = []
exp-no-promotion-batch = []
exp-no-perft-xor = []
exp-slider-planes = ["exp-compact-board"]
exp-slider-planes-kingless = ["exp-slider-planes"]
exp-hash-role-scan = []
exp-fen-byte-copy = []
exp-inline-make = []
exp-split-quiet = []
exp-role-select = []
exp-attack-descriptor = []
exp-fast-castle-keys = []
exp-promotion-batch = ["exp-full-visitor"]
exp-perft-xor = []
exp-leaf-reuse = ["exp-full-visitor"]
exp-prepared-move = ["exp-normal-kernel"]
exp-compact-attacks = []
exp-bool-attacks = []
exp-uci-sort-key = []
exp-fen-rank = []
exp-nibble-role = []
exp-role-planes = []
exp-color-make = []
exp-checked-known = []
exp-unmake-xor = []
exp-kingless-board = []
exp-known-role = []
exp-static-unchecked = []
exp-castle-hash-table = []
exp-normal-kernel = []
exp-checker-rays = []
exp-checked-direct = []
exp-uci-bytes = []
exp-hash-unroll = []
exp-full-visitor = []
exp-king-local = []
exp-pin-rays = []
exp-fused-geometry = []
exp-uci-direct = []
exp-tagged-perft = []
exp-perft-kernel = []
exp-direct-hash = []
exp-quiet-fast = []
exp-standard-no-special = []
exp-compact-board = []
exp-mailbox = []
exp-direct-legal = []
exp-early-san = []
exp-standard-movegen = []
exp-ep-candidates = []
exp-static-sliders = []
exp-mutation = []
exp-undo-role = []
exp-ray-prefilter = []
exp-king-targets = []
exp-copy-perft = []
exp-fused-perft = []
exp-san = []
exp-uci = []
exp-standard-castle = []
exp-role-lookup = []
default = ["std"]
std = []
pext = [] # Enables hardware PEXT (BMI2) 1-cycle bitboards
simd = [] # Enables AVX2/NEON vectorization where supported

[dependencies]
arrayvec = { version = "0.7", default-features = false }
bitflags = { version = "2.4", optional = true }
rayon = "1.10" # Batch-replay work-stealing thread pool (ADR-002)

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false

[profile.bench]
lto = "fat"
codegen-units = 1
incremental = false
debug = false

[dev-dependencies]
criterion = "0.5"
rayon = "1.10"
cozy-chess = "0.3" # Head-to-head benchmark reference (dev-dependency)
shakmaty = "0.30" # Baseline verification + SAN parity oracle (dev-dependency only)

[[bench]]
name = "perft_bench"
harness = false

[[bench]]
name = "replay_bench"
harness = false

[[bench]]
name = "vs_libraries"
harness = false
path = "benches/vs_libraries/main.rs"

[[bench]]
name = "codec_bench"
harness = false

[[bench]]
name = "micro"
harness = false
