[package]
name = "gigachess-competitive-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
arrayvec = "0.7"
gigachess = { path = "../.." }
shakmaty = "=0.30.0"
cozy-chess = "=0.3.4"
chess = "=3.2.0"
ultra = { package = "ultrachess-core", git = "https://github.com/yahorbarkouski/ultrachess", rev = "ddc2e95cbf9c401ef9e25534b00481a82fda0448" }
ferrum = { package = "ferrum-movegen", git = "https://github.com/TheChii/ferrum-movegen", rev = "cd46b935e606ad559e88d89642db2d425d4a5872" }

[features]
exp-tagged-perft = ["gigachess/exp-tagged-perft"]
exp-perft-kernel = ["gigachess/exp-perft-kernel"]
exp-direct-hash = ["gigachess/exp-direct-hash"]
exp-quiet-fast = ["gigachess/exp-quiet-fast"]
exp-standard-no-special = ["gigachess/exp-standard-no-special"]
exp-compact-board = ["gigachess/exp-compact-board"]
exp-mailbox = ["gigachess/exp-mailbox"]
exp-direct-legal = ["gigachess/exp-direct-legal"]
exp-early-san = ["gigachess/exp-early-san"]
exp-standard-movegen = ["gigachess/exp-standard-movegen"]
exp-ep-candidates = ["gigachess/exp-ep-candidates"]
exp-static-sliders = ["gigachess/exp-static-sliders"]
exp-mutation = ["gigachess/exp-mutation"]
exp-undo-role = ["gigachess/exp-undo-role"]
exp-ray-prefilter = ["gigachess/exp-ray-prefilter"]
exp-king-targets = ["gigachess/exp-king-targets"]
exp-copy-perft = ["gigachess/exp-copy-perft"]
exp-fused-perft = ["gigachess/exp-fused-perft"]
exp-san = ["gigachess/exp-san"]
exp-uci = ["gigachess/exp-uci"]
exp-standard-castle = ["gigachess/exp-standard-castle"]
exp-role-lookup = ["gigachess/exp-role-lookup"]
pext = ["gigachess/pext", "cozy-chess/pext", "ferrum/pext"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
