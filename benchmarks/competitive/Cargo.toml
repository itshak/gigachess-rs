[package]
name = "gigachess-competitive-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
arrayvec = "0.7"
gigachess = { path = "../.." }
shakmaty = "=0.30.0"
cozy-chess = "=0.3.4"
chess = "=3.2.0"
ultra = { package = "ultrachess-core", git = "https://github.com/yahorbarkouski/ultrachess", rev = "ddc2e95cbf9c401ef9e25534b00481a82fda0448" }
ferrum = { package = "ferrum-movegen", git = "https://github.com/TheChii/ferrum-movegen", rev = "cd46b935e606ad559e88d89642db2d425d4a5872" }

[features]
exp-hash-two-lanes = ["gigachess/exp-hash-two-lanes"]
exp-checker-near = ["gigachess/exp-checker-near"]
exp-castle-standard-clear = ["gigachess/exp-castle-standard-clear"]
exp-role-test-bit = ["gigachess/exp-role-test-bit"]
exp-pawn-transition = ["gigachess/exp-pawn-transition"]
exp-pawn-key-delta = ["gigachess/exp-pawn-key-delta"]
exp-single-color-transition = ["gigachess/exp-single-color-transition"]
exp-equal-capture = ["gigachess/exp-equal-capture"]
exp-leaf-base = ["gigachess/exp-leaf-base"]
exp-leaf-check-delta = ["gigachess/exp-leaf-check-delta"]
exp-implicit-queen = ["gigachess/exp-implicit-queen"]
exp-align16-override = ["gigachess/exp-align16-override"]
exp-role-key-fold = ["gigachess/exp-role-key-fold"]
exp-implicit-pawn = ["gigachess/exp-implicit-pawn"]
exp-role-weight = ["gigachess/exp-role-weight"]
exp-leaf-direct = ["gigachess/exp-leaf-direct"]
exp-color-pawn = ["gigachess/exp-color-pawn"]
exp-hash-square-order = ["gigachess/exp-hash-square-order"]
exp-packed-meta = ["gigachess/exp-packed-meta"]
exp-checker-hybrid = ["gigachess/exp-checker-hybrid"]
exp-checker-color = ["gigachess/exp-checker-color"]
exp-direct-key = ["gigachess/exp-direct-key"]
exp-castle-file-gate = ["gigachess/exp-castle-file-gate"]
exp-no-rights-kernel = ["gigachess/exp-no-rights-kernel"]
exp-promotion-direct = ["gigachess/exp-promotion-direct"]
exp-layout-hot = ["gigachess/exp-layout-hot"]
exp-layout-roles = ["gigachess/exp-layout-roles"]
exp-hash-role-order = ["gigachess/exp-hash-role-order"]
exp-ray-combined = ["gigachess/exp-ray-combined"]
exp-unalign = ["gigachess/exp-unalign"]
exp-kingless-ray = ["gigachess/exp-kingless-ray"]
exp-checker-sentinel = ["gigachess/exp-checker-sentinel"]
exp-refresh-inline = ["gigachess/exp-refresh-inline"]
exp-attack-mask = ["gigachess/exp-attack-mask"]
exp-castle-pair = ["gigachess/exp-castle-pair"]
exp-hash-turn-fold = ["gigachess/exp-hash-turn-fold"]
exp-quiet-ep-gate = ["gigachess/exp-quiet-ep-gate"]
exp-promo-checkers = ["gigachess/exp-promo-checkers"]
exp-pawnless4 = ["gigachess/exp-pawnless4", "exp-sparse-role3"]
exp-zone-sliders = ["gigachess/exp-zone-sliders"]
exp-ep-mask = ["gigachess/exp-ep-mask"]
exp-special-cold = ["gigachess/exp-special-cold"]
exp-role-tree = ["gigachess/exp-role-tree"]
exp-role-simd = ["gigachess/exp-role-simd"]
exp-capture-direct = ["gigachess/exp-capture-direct"]
exp-checked-cached = ["gigachess/exp-checked-cached"]
exp-quiet-common = ["gigachess/exp-quiet-common"]
exp-sparse-role3 = ["gigachess/exp-sparse-role3", "exp-slider-planes"]
exp-sparse-role3-branchless = ["gigachess/exp-sparse-role3-branchless", "exp-sparse-role3"]
exp-direct-role-xor = ["gigachess/exp-direct-role-xor"]
exp-castle-compact = ["gigachess/exp-castle-compact"]
exp-checker-pair = ["gigachess/exp-checker-pair"]
exp-compact-attack-desc = ["gigachess/exp-compact-attack-desc"]
exp-blocked-sliders = ["gigachess/exp-blocked-sliders"]
exp-no-danger-needed = ["gigachess/exp-no-danger-needed"]
exp-undo-outside = ["gigachess/exp-undo-outside"]
exp-hash-pointer = ["gigachess/exp-hash-pointer"]
exp-hash-pair = ["gigachess/exp-hash-pair"]
exp-fen-code-lut = ["gigachess/exp-fen-code-lut"]
exp-color-gen = ["gigachess/exp-color-gen"]
exp-bulk-write = ["gigachess/exp-bulk-write"]
exp-pawn-kernel = ["gigachess/exp-pawn-kernel"]
exp-child-copy = ["gigachess/exp-child-copy"]
exp-checker-first = ["gigachess/exp-checker-first"]
exp-align16 = ["gigachess/exp-align16"]
exp-align32 = ["gigachess/exp-align32"]
exp-ordinary-kernel = ["gigachess/exp-ordinary-kernel"]
exp-hash-pawn-bytes = ["gigachess/exp-hash-pawn-bytes"]
exp-hash-delta = ["gigachess/exp-hash-delta"]
exp-no-promotion-batch = ["gigachess/exp-no-promotion-batch"]
exp-no-perft-xor = ["gigachess/exp-no-perft-xor"]
exp-slider-planes = ["gigachess/exp-slider-planes", "exp-compact-board"]
exp-slider-planes-kingless = ["gigachess/exp-slider-planes-kingless", "exp-slider-planes"]
exp-hash-role-scan = ["gigachess/exp-hash-role-scan"]
exp-fen-byte-copy = ["gigachess/exp-fen-byte-copy"]
exp-inline-make = ["gigachess/exp-inline-make"]
exp-split-quiet = ["gigachess/exp-split-quiet"]
exp-role-select = ["gigachess/exp-role-select"]
exp-attack-descriptor = ["gigachess/exp-attack-descriptor"]
exp-fast-castle-keys = ["gigachess/exp-fast-castle-keys"]
exp-promotion-batch = ["gigachess/exp-promotion-batch", "exp-full-visitor"]
exp-perft-xor = ["gigachess/exp-perft-xor"]
exp-leaf-reuse = ["gigachess/exp-leaf-reuse", "exp-full-visitor"]
exp-prepared-move = ["gigachess/exp-prepared-move"]
exp-compact-attacks = ["gigachess/exp-compact-attacks"]
exp-bool-attacks = ["gigachess/exp-bool-attacks"]
exp-uci-sort-key = ["gigachess/exp-uci-sort-key"]
exp-fen-rank = ["gigachess/exp-fen-rank"]
exp-nibble-role = ["gigachess/exp-nibble-role"]
exp-role-planes = ["gigachess/exp-role-planes"]
exp-color-make = ["gigachess/exp-color-make"]
exp-checked-known = ["gigachess/exp-checked-known"]
exp-unmake-xor = ["gigachess/exp-unmake-xor"]
# For this paired experiment branch only, C is the benchmark baseline.
default = ["baseline-o"]
baseline-o = ["baseline-n", "exp-refresh-inline", "exp-quiet-ep-gate"]
baseline-n = ["baseline-m", "exp-leaf-direct"]
baseline-m = ["baseline-l", "exp-no-danger-needed", "exp-zone-sliders"]
baseline-l = ["baseline-k", "exp-layout-roles"]
baseline-k = ["baseline-j", "exp-inline-make"]
baseline-j = ["baseline-i", "exp-special-cold", "exp-align32", "exp-blocked-sliders"]
baseline-i = ["baseline-f", "exp-undo-outside"]
baseline-f = ["baseline-e", "exp-fen-rank"]
baseline-e = ["baseline-c", "exp-checker-rays", "exp-full-visitor", "exp-color-make", "exp-checked-known", "exp-unmake-xor", "exp-known-role", "exp-static-unchecked", "exp-uci-sort-key", "exp-compact-attacks", "exp-bool-attacks", "exp-promotion-batch", "exp-perft-xor"]
baseline-c = ["exp-static-sliders", "exp-ray-prefilter", "exp-san", "exp-uci", "exp-fused-perft", "exp-copy-perft", "exp-mutation", "exp-compact-board", "exp-direct-legal", "exp-early-san", "exp-perft-kernel", "exp-quiet-fast", "exp-fused-geometry", "exp-uci-direct", "exp-ep-candidates"]
exp-kingless-board = ["gigachess/exp-kingless-board"]
exp-known-role = ["gigachess/exp-known-role"]
exp-static-unchecked = ["gigachess/exp-static-unchecked"]
exp-castle-hash-table = ["gigachess/exp-castle-hash-table"]
exp-normal-kernel = ["gigachess/exp-normal-kernel"]
exp-checker-rays = ["gigachess/exp-checker-rays"]
exp-checked-direct = ["gigachess/exp-checked-direct"]
exp-uci-bytes = ["gigachess/exp-uci-bytes"]
exp-hash-unroll = ["gigachess/exp-hash-unroll"]
exp-full-visitor = ["gigachess/exp-full-visitor"]
exp-king-local = ["gigachess/exp-king-local"]
exp-pin-rays = ["gigachess/exp-pin-rays"]
exp-fused-geometry = ["gigachess/exp-fused-geometry"]
exp-uci-direct = ["gigachess/exp-uci-direct"]
exp-tagged-perft = ["gigachess/exp-tagged-perft"]
exp-perft-kernel = ["gigachess/exp-perft-kernel"]
exp-direct-hash = ["gigachess/exp-direct-hash"]
exp-quiet-fast = ["gigachess/exp-quiet-fast"]
exp-standard-no-special = ["gigachess/exp-standard-no-special"]
exp-compact-board = ["gigachess/exp-compact-board"]
exp-mailbox = ["gigachess/exp-mailbox"]
exp-direct-legal = ["gigachess/exp-direct-legal"]
exp-early-san = ["gigachess/exp-early-san"]
exp-standard-movegen = ["gigachess/exp-standard-movegen"]
exp-ep-candidates = ["gigachess/exp-ep-candidates"]
exp-static-sliders = ["gigachess/exp-static-sliders"]
exp-mutation = ["gigachess/exp-mutation"]
exp-undo-role = ["gigachess/exp-undo-role"]
exp-ray-prefilter = ["gigachess/exp-ray-prefilter"]
exp-king-targets = ["gigachess/exp-king-targets"]
exp-copy-perft = ["gigachess/exp-copy-perft"]
exp-fused-perft = ["gigachess/exp-fused-perft"]
exp-san = ["gigachess/exp-san"]
exp-uci = ["gigachess/exp-uci"]
exp-standard-castle = ["gigachess/exp-standard-castle"]
exp-role-lookup = ["gigachess/exp-role-lookup"]
pext = ["gigachess/pext", "cozy-chess/pext", "ferrum/pext"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
